name: PR Check (app)

# Deterministic gate for the app/ React migration. Everything a machine can
# decide without judgement lives here, not in a Tester worker: lint, typecheck,
# build, unit tests. Workers are for behaviour verification only.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app deps
        id: install
        run: npm ci

      # Every check below runs even if an earlier one failed, so a single run
      # reports the complete fix list instead of one error at a time.
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Typecheck + build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build

      - name: Unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test
